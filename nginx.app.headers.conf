# nginx's add_header does NOT merge: a location block that sets any add_header discards every
# add_header inherited from the server block. So the security headers cannot live once at the
# top - they have to be included into each location that sets a header of its own, or they
# vanish from exactly the pages that matter.

# The per-page CSP is generated into a <meta> by eleventy.common.js and covers scripts, styles
# and connections. This adds only what a meta tag cannot express - a browser enforces both
# policies, so a request has to be allowed by each of them.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
