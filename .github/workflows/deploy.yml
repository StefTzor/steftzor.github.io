name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions needed for the official Pages deployment via GITHUB_TOKEN (no PAT required)
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test # Consent gate and auth security invariants

      - name: Build Project
        run: npm run build # Runs Tailwind and Eleventy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Notify IndexNow-enabled engines (Bing, Yandex, Seznam, Naver, Yep) of updated URLs
      # Posts the list the build generated, rather than a second copy maintained here. The two
      # drifted apart before. This job has no checkout, so it fetches the file it just published -
      # which also means a ping can only ever describe what is actually live.
      - name: Ping IndexNow
        run: |
          set -o pipefail
          if curl -sS --fail --max-time 30 \
               "https://tzortzoglou.eu/indexnow.json?cachebust=${GITHUB_SHA}" \
               -o indexnow.json; then
            echo "Pinging IndexNow with $(python3 -c 'import json;print(len(json.load(open("indexnow.json"))["urlList"]))') URLs"
            curl -sS --max-time 30 -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @indexnow.json
          else
            # A failed ping must not fail a good deploy; search engines recrawl anyway.
            echo "::warning::Could not fetch indexnow.json - skipping the IndexNow ping."
          fi
