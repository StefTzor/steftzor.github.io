<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="bg-brand-bg shadow-md sticky top-0 z-50 border-b border-brand-muted/10 transition-colors duration-300">
  <div class="container mx-auto flex justify-between items-center p-4">
    <div class="logo">
      <a href="/"
        class="bg-gradient-to-r from-brand-accent to-blue-700 dark:to-blue-400 bg-clip-text text-transparent font-bold text-xl tracking-tight inline-block transition-transform duration-200 hover:-translate-y-1">
        Stefanos Tzortzoglou
      </a>
    </div>

    <nav class="hidden md:flex space-x-6 items-center" aria-label="Main">
      <a href="/"
        class="text-brand-text hover:text-brand-accent font-medium transition-transform duration-200 hover:-translate-y-1">Home</a>
      <a href="/about/"
        class="text-brand-text hover:text-brand-accent font-medium transition-transform duration-200 hover:-translate-y-1 border-b-2 border-transparent">About</a>
      <a href="/portfolio/"
        class="text-brand-text hover:text-brand-accent font-medium transition-transform duration-200 hover:-translate-y-1">Portfolio</a>
      <a href="/code/"
        class="text-brand-text hover:text-brand-accent font-medium transition-transform duration-200 hover:-translate-y-1">Code</a>
      <a href="/contact/"
        class="text-brand-text hover:text-brand-accent font-medium transition-transform duration-200 hover:-translate-y-1">Contact</a>

      <div class="relative hidden" id="exclusive-nav-item">
        <button id="desktop-exclusive-toggle" type="button" aria-expanded="false" aria-controls="desktop-exclusive-menu"
          class="text-brand-text hover:text-brand-accent font-medium flex items-center gap-1 transition-transform duration-200 hover:-translate-y-1 py-2">
          Exclusive Content
          <i class="fas fa-chevron-down text-xs transition-transform" id="desktop-exclusive-chevron"
            aria-hidden="true"></i>
        </button>
        <div id="desktop-exclusive-menu"
          class="hidden absolute left-0 mt-0 w-56 bg-brand-surface border border-brand-muted/20 shadow-xl transition-all duration-200 rounded-lg overflow-hidden z-50">
          <a href="/exclusive/"
            class="block px-4 py-3 text-sm text-brand-text hover:bg-brand-accent hover:text-brand-onaccent transition-colors">
            All Exclusive Content
          </a>
        </div>
      </div>
    </nav>

    <div id="auth-status" class="hidden md:flex items-center space-x-4">
      <div id="guest-view" class="flex items-center space-x-4">
        <a href="/login/"
          class="text-brand-text hover:text-brand-accent transition-transform duration-200 hover:-translate-y-1 inline-block">
          <i class="fas fa-sign-in-alt text-lg" aria-hidden="true"></i>
          <span class="sr-only">Log in</span>
        </a>
        <a href="/register/"
          class="text-brand-text hover:text-brand-accent transition-transform duration-200 hover:-translate-y-1 inline-block">
          <i class="fas fa-user-plus text-lg" aria-hidden="true"></i>
          <span class="sr-only">Create an account</span>
        </a>
      </div>

      <div id="user-view" class="hidden flex items-center space-x-4">
        <span id="user-display"
          class="text-sm font-medium text-brand-text opacity-80 border-r border-brand-muted/30 pr-4"></span>
        <button id="logoutBtn" type="button"
          class="text-brand-text hover:text-red-700 dark:hover:text-red-400 transition-transform duration-200 hover:-translate-y-1 inline-block">
          <i class="fas fa-sign-out-alt text-lg" aria-hidden="true"></i>
          <span class="sr-only">Log out</span>
        </button>
      </div>

      <button id="theme-toggle" type="button" aria-pressed="false"
        class="text-brand-text hover:text-brand-accent p-2 rounded-full hover:bg-brand-muted/10 transition-transform duration-200 hover:-translate-y-1 ml-2">
        <i class="fas fa-adjust text-lg" aria-hidden="true"></i>
        <span class="sr-only">Switch to light theme</span>
      </button>
    </div>

    <div class="md:hidden flex items-center gap-4">
      <button id="theme-toggle-mobile" type="button" aria-pressed="false"
        class="text-brand-text hover:text-brand-accent text-xl">
        <i class="fas fa-adjust" aria-hidden="true"></i>
        <span class="sr-only">Switch to light theme</span>
      </button>
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav"
        class="text-brand-text hover:text-brand-accent text-2xl">
        <i class="fas fa-bars" aria-hidden="true"></i>
        <span class="sr-only">Open menu</span>
      </button>
    </div>
  </div>

  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300" id="overlay"
    aria-hidden="true">
  </div>

  <nav id="mobile-nav" aria-label="Mobile" inert
    class="fixed top-0 right-0 w-[80%] max-w-sm h-full bg-brand-bg z-50 transform translate-x-full transition-transform duration-300 ease-in-out shadow-2xl overflow-y-auto border-l border-brand-muted/20">
    <div class="flex justify-between items-center p-5 border-b border-brand-muted/10">
      <div class="text-xl font-bold text-brand-accent">Menu</div>
      <button id="close-menu" type="button" class="text-brand-muted hover:text-brand-accent text-2xl">
        <i class="fas fa-times" aria-hidden="true"></i>
        <span class="sr-only">Close menu</span>
      </button>
    </div>

    <ul class="p-5 space-y-2">
      <li><a href="/"
          class="block py-3 px-4 rounded-lg text-brand-text hover:bg-brand-surface hover:text-brand-accent font-medium">Home</a>
      </li>
      <li><a href="/about/"
          class="block py-3 px-4 rounded-lg text-brand-text hover:bg-brand-surface hover:text-brand-accent font-medium">About</a>
      </li>
      <li><a href="/portfolio/"
          class="block py-3 px-4 rounded-lg text-brand-text hover:bg-brand-surface hover:text-brand-accent font-medium">Portfolio</a>
      </li>
      <li><a href="/code/"
          class="block py-3 px-4 rounded-lg text-brand-text hover:bg-brand-surface hover:text-brand-accent font-medium">Code</a>
      </li>
      <li><a href="/contact/"
          class="block py-3 px-4 rounded-lg text-brand-text hover:bg-brand-surface hover:text-brand-accent font-medium">Contact</a>
      </li>

      <li id="mobile-exclusive-item" class="hidden">
        <button id="exclusive-toggle" type="button" aria-expanded="false" aria-controls="mobile-dropdown"
          class="w-full flex justify-between items-center py-3 px-4 rounded-lg text-brand-text hover:bg-brand-surface hover:text-brand-accent font-medium">
          <span>Exclusive Content</span>
          <i class="fas fa-chevron-down text-sm transition-transform duration-300" id="exclusive-chevron"
            aria-hidden="true"></i>
        </button>
        <ul id="mobile-dropdown" class="hidden pl-4 mt-1 space-y-1 bg-brand-surface/50 rounded-lg mx-2">
          <li><a href="/exclusive/" class="block py-2 px-4 text-sm text-brand-muted hover:text-brand-accent">All
              Content</a></li>
        </ul>
      </li>

      <li class="pt-6 mt-6 border-t border-brand-muted/20">
        <div id="mobile-guest-view" class="grid grid-cols-2 gap-4">
          <a href="/login/"
            class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-brand-muted/30 text-brand-text hover:border-brand-accent hover:text-brand-accent transition-colors">
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Log in
          </a>
          <a href="/register/"
            class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-brand-accent text-brand-onaccent hover:bg-brand-hover hover:shadow-lg transition-all">
            <i class="fas fa-user-plus" aria-hidden="true"></i> Create account
          </a>
        </div>

        <div id="mobile-user-view" class="hidden flex flex-col gap-4">
          <div class="text-center p-2 bg-brand-surface rounded-lg">
            <span class="text-sm text-brand-muted">Signed in as:</span>
            <p id="mobile-user-email" class="font-medium text-brand-text truncate"></p>
          </div>
          <button id="mobile-logout-btn" type="button"
            class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-red-700/40 dark:border-red-400/40 text-red-700 dark:text-red-400 hover:bg-red-700 dark:hover:bg-red-600 hover:text-white transition-all">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Log out
          </button>
        </div>
      </li>
    </ul>
  </nav>
</header>
