server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  # text/javascript is here for the .mjs location below: gzip decides by the type it ends up with,
  # and 1.1 MB of library going out uncompressed would undo the point of caching it.
  gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Fingerprinted by the cachebust transform, so a new deploy changes the URL rather than
  # needing the old one to expire.
  # /vendor is here for the same reason /dist and /fonts are: its contents are a pinned release
  # of a third-party library, so the bytes at a given path never change. Without this it would
  # fall through to `private, no-store` below and re-download 300 KB of MapLibre on every visit
  # to a page with a map on it.
  # `.mjs` is NOT in nginx's default mime.types, so it is served as application/octet-stream, and
  # a browser refuses an ES module whose type is not JavaScript - which is exactly how this failed
  # in production: "Expected a JavaScript-or-Wasm module script", and nothing else. MapLibre v6
  # ships only `.mjs`. The build could not have caught it; it checks the file EXISTS at the path
  # the page asks for and cannot know what a server will label it.
  #
  # `default_type` rather than a `types { }` block, and this is the part worth not re-learning:
  # a `types` block inside `server` or `location` REPLACES the inherited map rather than adding to
  # it. Measured against nginx:alpine - with `types { text/javascript mjs; }` here, the .mjs was
  # correct and CSS, PNG and HTML all became application/octet-stream. `default_type` only fills in
  # what the map does not already answer, so it adds this one extension and touches nothing else.
  #
  # Must precede the /vendor/ rule below: nginx tries regex locations in the order they are
  # written, so the broader one would win otherwise. The cache header and the security snippet are
  # repeated because `add_header` does not merge - a location that sets one discards every header
  # it would have inherited, which is what scripts/app-headers.test.js exists to catch.
  location ~* ^/vendor/.+\.mjs$ {
    include /etc/nginx/snippets/security.conf;
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* ^/(dist|fonts|vendor)/ {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Nothing behind a login may sit in a shared cache.
  location / {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "private, no-store" always;
    try_files $uri $uri/ $uri.html =404;
  }

  location = /health {
    include /etc/nginx/snippets/security.conf;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
