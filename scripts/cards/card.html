<!doctype html>
<meta charset="utf-8">
<!--
  One template, three shapes. Rendered by scripts/cards/render.mjs with headless Chrome; the
  text comes from _data/identity.js and never lives in this file.

  Tokens are the site's dark-theme values verbatim (src/input.css): a shared link should look
  like the page it opens.
-->
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../fonts/poppins-400-latin.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(../../fonts/poppins-500-latin.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../fonts/poppins-600-latin.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../fonts/poppins-700-latin.woff2) format('woff2'); }

  :root {
    --bg: #0f172a;        /* brand-bg, dark */
    --text: #f1f5f9;      /* brand-text, 16.3:1 on bg */
    --muted: #94a3b8;     /* brand-muted, 6.96:1 on bg */
    --accent: #10b981;    /* brand-accent, 7.04:1 on bg */
    --blue: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Poppins, system-ui, sans-serif; background: var(--bg); color: var(--text); }

  .card { position: relative; overflow: hidden; background: var(--bg); display: flex; align-items: center; }
  /* The faint lattice from the existing og-cover, rebuilt as CSS so it scales with the shape. */
  .card::before {
    content: ''; position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(115deg, rgba(148,163,184,.055) 1px, transparent 1px),
      linear-gradient(65deg,  rgba(148,163,184,.055) 1px, transparent 1px);
    background-size: 52px 52px;
  }
  /* The accent edge, top-left to bottom-left, emerald into blue. */
  .card::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
    background: linear-gradient(180deg, var(--accent), var(--blue));
  }
  .inner { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; }

  .photo { border-radius: 50%; object-fit: cover; border: 6px solid var(--accent); flex-shrink: 0; }
  .name { font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
  .name-el { font-weight: 300; color: var(--muted); }
  .rule { height: 4px; width: 88px; background: var(--accent); border-radius: 2px; }
  .role { font-weight: 600; color: var(--accent); line-height: 1.25; }
  .claim { font-weight: 500; color: var(--text); line-height: 1.3; }
  .stack { color: var(--muted); }
  .url { color: var(--muted); }

  /* --- og-cover: 1200x630. The only one with the photo; nothing else shows it beside the card. */
  .og { width: 1200px; height: 630px; }
  .og .inner { gap: 64px; padding: 0 80px; }
  .og .photo { width: 280px; height: 280px; }
  .og .name { font-size: 62px; }
  .og .name-el { font-size: 27px; margin-top: 8px; }
  .og .rule { margin: 26px 0; }
  .og .role { font-size: 33px; }
  .og .claim { font-size: 25px; margin-top: 14px; }
  .og .stack { font-size: 23px; margin-top: 22px; }
  .og .url { font-size: 20px; margin-top: 16px; }

  /* --- LinkedIn: 1584x396. No photo: the profile avatar already sits over this banner, and it
         covers the lower left, so everything is pushed right of it. */
  .li { width: 1584px; height: 396px; }
  .li .inner { padding: 0 96px 0 620px; flex-direction: column; align-items: flex-start; justify-content: center; }
  .li .name { font-size: 58px; }
  .li .rule { margin: 20px 0; }
  .li .role { font-size: 29px; }
  .li .claim { font-size: 23px; margin-top: 12px; }
  .li .stack { font-size: 20px; margin-top: 18px; }

  /* --- GitHub: 1000x280. No photo either; the avatar is beside it on the profile. Centred,
         the way the capsule-render banner it replaces was. */
  .gh { width: 1000px; height: 280px; }
  .gh .inner { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .gh .name { font-size: 56px; color: var(--accent); }
  .gh .subtitle { font-size: 21px; color: var(--text); margin-top: 16px; font-weight: 400; }
  .gh .stack { font-size: 17px; margin-top: 14px; }
</style>
<body><div id="card"></div></body>
